name: Continuous Fuzzing

on:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Property-based Fuzz Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts
          # The bun package's postinstall links its platform binary. Other
          # lifecycle scripts stay skipped.
          node packages/di-framework-cli/node_modules/bun/install.js

      - name: Build packages
        run: bun run build

      - name: Run Fuzz Tests
        run: bun test packages/di-framework-core/tests/cron-fuzz.test.ts
