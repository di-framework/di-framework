name: Deploy Documentation

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'docs/**'
      - 'examples/packages/docs-search/**'
      - '.github/workflows/deploy-docs.yml'
      - '.github/scripts/assemble-docs-site.sh'
  # Path filters apply to tag pushes too. release.yml also dispatches this
  # workflow on v* so a version snapshot is archived even when the tag
  # commit did not touch docs/.
  workflow_dispatch:
    inputs:
      full_reindex:
        description: 'Force full Vectorize re-embed (ignore content hashes)'
        type: boolean
        default: false

env:
  INSTANCE: 'Writerside/d'
  DOCKER_VERSION: '2.1.1479-p3869'
  DOCS_SEARCH_DIR: examples/packages/docs-search
  # Must match Worker var GITHUB_OIDC_AUDIENCE
  OIDC_AUDIENCE: di-framework-docs-search

permissions:
  contents: write # attach docs-vX.Y.zip to the GitHub Release on v* tags
  pages: write
  id-token: write # GitHub OIDC → worker mints reindex token (no Cloudflare API secrets)
  actions: read # download coverage-badges artifact from the Test workflow

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Build corpus → exchange OIDC for worker token → POST /reindex (no CF creds)
  index-search:
    name: Index docs search
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install monorepo dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild search corpus from Writerside topics
        working-directory: ${{ env.DOCS_SEARCH_DIR }}
        run: bun run corpus

      - name: Resolve search Worker URL
        id: worker
        env:
          # Override with vars.DOCS_SEARCH_URL if needed.
          # Prefer workers.dev for CI: apex DNS (di-framework.dev) has been flaky
          # for some resolvers including GitHub-hosted runners.
          DOCS_SEARCH_URL: ${{ vars.DOCS_SEARCH_URL }}
        run: |
          set -euo pipefail
          # Worker also mounts under BASE_PATH on workers.dev (same as apex route).
          URL="${DOCS_SEARCH_URL:-https://di-framework-docs-search.seemueller.workers.dev/api/docs/search}"
          URL="${URL%/}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Worker: $URL"

      - name: Mint reindex token via Worker (GitHub OIDC)
        id: auth
        env:
          DOCS_SEARCH_URL: ${{ steps.worker.outputs.url }}
          OIDC_AUDIENCE: ${{ env.OIDC_AUDIENCE }}
        run: |
          set -euo pipefail
          # Request an OIDC JWT for this workflow run (no long-lived secrets)
          OIDC=$(curl -fsSL \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=${OIDC_AUDIENCE}" \
            | jq -r .value)
          echo "::add-mask::$OIDC"

          WORKER="${DOCS_SEARCH_URL}"
          RESP=$(curl -fsS -X POST "${WORKER}/auth/token" \
            -H "Authorization: Bearer ${OIDC}" \
            -H "Content-Type: application/json")
          TOKEN=$(echo "$RESP" | jq -r .access_token)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Worker did not return access_token: $RESP"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "worker=$WORKER" >> "$GITHUB_OUTPUT"
          echo "Minted reindex token (expires $(echo "$RESP" | jq -r .expires_at))"

      - name: Push corpus + incremental Vectorize reindex
        env:
          WORKER: ${{ steps.auth.outputs.worker }}
          TOKEN: ${{ steps.auth.outputs.token }}
          FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full_reindex || false }}
          CORPUS: ${{ env.DOCS_SEARCH_DIR }}/data/corpus.json
        run: |
          set -euo pipefail
          if [ "$FULL" = "true" ]; then
            ENDPOINT="${WORKER}/reindex?full=1"
          else
            ENDPOINT="${WORKER}/reindex"
          fi
          echo "POST $ENDPOINT (corpus from $CORPUS)"
          curl -fsS -X POST "$ENDPOINT" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @"$CORPUS" \
            | tee /tmp/reindex.json
          echo
          jq -e '.ok == true' /tmp/reindex.json >/dev/null

          if [ "${{ github.ref_type }}" = "tag" ] && echo "${{ github.ref_name }}" | grep -Eq '^v[0-9]+\.[0-9]+'; then
            TAG="${{ github.ref_name }}"
            MINOR="$(echo "$TAG" | sed -E 's/^(v[0-9]+\.[0-9]+).*/\1/')"
            SNAP="${{ env.DOCS_SEARCH_DIR }}/data/corpus-${MINOR}.json"
            echo "Indexing snapshot $MINOR from $TAG"
            (
              cd "${{ env.DOCS_SEARCH_DIR }}"
              DOCS_VERSION="$MINOR" CORPUS_OUT="$SNAP" bun run corpus
            )
            curl -fsS -X POST "$ENDPOINT" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @"$SNAP" \
              | tee /tmp/reindex-snapshot.json
            echo
            jq -e '.ok == true' /tmp/reindex-snapshot.json >/dev/null
          fi

  build:
    name: Build Writerside site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build docs using Writerside Docker builder
        uses: JetBrains/writerside-github-action@738910d7cf197d67188300d0e0f84b2e708db3cf # v4
        with:
          instance: ${{ env.INSTANCE }}
          location: docs
          docker-version: ${{ env.DOCKER_VERSION }}
          artifact: 'webHelpD2-all.zip'

      - name: Unzip artifact
        run: unzip -O UTF-8 -qq artifacts/webHelpD2-all.zip -d dir

      # Writerside only shows the search UI when config.json has a truthy
      # searchService. Some builder versions do not emit these keys from
      # <search-endpoint> alone — patch so the bar always appears.
      # custom-favicons renders its value as page text in this builder, so add
      # the favicon link directly to the generated HTML instead.
      - name: Patch generated Writerside site
        env:
          SEARCH_ENDPOINT: ${{ vars.DOCS_SEARCH_URL }}
        run: |
          set -euo pipefail
          ENDPOINT="${SEARCH_ENDPOINT:-https://di-framework-docs-search.seemueller.workers.dev/api/docs/search}"
          ENDPOINT="${ENDPOINT%/}"
          # Help module dir + instance id → /preview-search/{project}/{instance}
          SERVICE_URL="${ENDPOINT}/preview-search/Writerside/d"
          python3 - <<PY
          import json
          from pathlib import Path
          p = Path("dir/config.json")
          cfg = json.loads(p.read_text())
          # Writerside app.js only fetches versionsService when productId is set.
          cfg["productId"] = "d"
          cfg["searchService"] = "custom"
          cfg["searchServiceUrl"] = "${SERVICE_URL}"
          p.write_text(json.dumps(cfg, separators=(",", ":")))
          print("config.json:", p.read_text())

          favicon = '<link rel="icon" type="image/png" href="/favicon.png">'
          patched = 0
          skipped = 0
          for html_path in Path("dir").rglob("*.html"):
              html = html_path.read_text()
              if favicon in html:
                  continue
              if "</head>" in html:
                  html = html.replace("</head>", f"  {favicon}\n</head>", 1)
              elif "<title>" in html:
                  # The generated redirect index uses an implicit HTML head.
                  html = html.replace("<title>", f"{favicon}\n<title>", 1)
              else:
                  print(f"Skipping headless HTML file: {html_path}")
                  skipped += 1
                  continue
              html_path.write_text(html)
              patched += 1
          print(f"Added favicon link to {patched} HTML files; skipped {skipped}")
          PY
          cp docs/Writerside/images/favicon.png dir/favicon.png
          cp docs/Writerside/images/favicon.png dir/favicon.ico

      - name: Assemble versioned GitHub Pages tree
        id: site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SEARCH_ENDPOINT: ${{ vars.DOCS_SEARCH_URL }}
        run: |
          chmod +x .github/scripts/assemble-docs-site.sh
          .github/scripts/assemble-docs-site.sh dir site

      # Shields endpoint badges: Test uploads coverage-badges/*.json; serve at
      # https://docs.di-framework.dev/coverage/{slug}.json
      - name: Resolve Test run with coverage badge JSON
        id: badge-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          find_run() {
            local sha="$1"
            gh run list --workflow=ci.yml --commit "$sha" --status success --limit 5 \
              --json databaseId,conclusion \
              --jq '[.[] | select(.conclusion == "success")][0].databaseId // empty'
          }
          RUN_ID="$(find_run "$GITHUB_SHA" || true)"
          # Writerside build usually outlasts Test; wait briefly if still in flight.
          if [[ -z "$RUN_ID" ]]; then
            for i in 1 2 3 4 5 6 7 8; do
              IN_FLIGHT="$(
                gh run list --workflow=ci.yml --commit "$GITHUB_SHA" --limit 5 \
                  --json databaseId,status,conclusion \
                  --jq '[.[] | select(.status != "completed")][0].databaseId // empty'
              )"
              if [[ -z "$IN_FLIGHT" ]]; then
                RUN_ID="$(find_run "$GITHUB_SHA" || true)"
                break
              fi
              echo "Test run $IN_FLIGHT still running (attempt $i); waiting…"
              sleep 30
              RUN_ID="$(find_run "$GITHUB_SHA" || true)"
              [[ -n "$RUN_ID" ]] && break
            done
          fi
          if [[ -z "$RUN_ID" ]]; then
            RUN_ID="$(
              gh run list --workflow=ci.yml --branch main --status success --limit 1 \
                --json databaseId --jq '.[0].databaseId // empty'
            )"
            echo "::warning::No successful Test run for $GITHUB_SHA; using latest main run $RUN_ID"
          fi
          if [[ -z "$RUN_ID" ]]; then
            echo "::warning::No Test run found; coverage badges will be omitted from this deploy"
            echo "run_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using coverage-badges from Test run $RUN_ID"

      - name: Download coverage badge JSON
        if: steps.badge-run.outputs.run_id != ''
        continue-on-error: true
        id: download-badges
        uses: actions/download-artifact@v8
        with:
          name: coverage-badges
          path: coverage-badges
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.badge-run.outputs.run_id }}

      - name: Publish coverage badges into Pages tree
        if: steps.badge-run.outputs.run_id != '' && steps.download-badges.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p site/coverage
          cp -v coverage-badges/*.json site/coverage/
          ls -la site/coverage

      - name: Attach version snapshot to GitHub Release
        if: github.ref_type == 'tag' && steps.site.outputs.snapshot_zip != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.site.outputs.snapshot_zip }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Release may be created by release.yml slightly later; create or retry.
          for i in 1 2 3 4 5 6; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "$ZIP" --clobber
              echo "Uploaded $(basename "$ZIP") to $TAG"
              exit 0
            fi
            if [[ "$i" -eq 1 ]]; then
              gh release create "$TAG" "$ZIP" --title "$TAG" --generate-notes \
                && echo "Created GitHub Release $TAG with $(basename "$ZIP")" \
                && exit 0 \
                || true
            fi
            echo "Release $TAG not visible yet (attempt $i); sleeping…"
            sleep 15
          done
          echo "::warning::No GitHub Release for $TAG; snapshot is still in Pages tree and as a workflow artifact."
          mkdir -p artifacts
          cp "$ZIP" "artifacts/$(basename "$ZIP")"

      - name: Upload version snapshot artifact
        if: github.ref_type == 'tag' && steps.site.outputs.snapshot_zip != ''
        uses: actions/upload-artifact@v4
        with:
          name: docs-${{ steps.site.outputs.snapshot_version }}
          path: ${{ steps.site.outputs.snapshot_zip }}
          if-no-files-found: ignore

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Pages must ship even if reindex is flaky (DNS/OIDC/Worker). Search UI is
  # baked into the static build via <search-endpoint>; the Worker can reindex later.
  deploy:
    name: Deploy GitHub Pages
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
