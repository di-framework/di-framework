name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Build packages
        run: bun run packages/di-framework-cli/cmd/build.ts

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure modern npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Publish packages to npm
        run: |
          set -euo pipefail
          # Must stay in step with PACKAGES in packages/di-framework-cli/cmd/build.ts.
          # `events` and `config` were missing here since they were added, so they
          # have been version-bumped and built by CI but never published.
          for pkg in packages/di-framework-core packages/di-framework-repo packages/di-framework-http packages/di-framework-graphql packages/di-framework-events packages/di-framework-config packages/di-framework-auth packages/di-framework-cli; do
            name=$(node -p "require('./$pkg/package.json').name")
            version=$(node -p "require('./$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "Skipping $name@$version (already published)"
              continue
            fi
            echo "Publishing $name@$version from $pkg"
            (cd "$pkg" && npm publish --access public --provenance --ignore-scripts)
          done
