name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run packages/di-framework-cli/main.ts mx build --sync-versions

      - name: Test
        run: bun run test:all

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure modern npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Align manifests and verify packed packages
        run: bun scripts/release-prepublish.ts
        env:
          DI_RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Publish packages to npm
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          cleanup() {
            git checkout -- packages/*/package.json || true
          }
          trap cleanup EXIT
          # Must stay in step with PACKAGES in packages/di-framework-cli/cmd/mx/build.ts.
          # Manifests were already aligned by release-prepublish.ts; this loop only
          # publishes. package.json files are restored via trap.
          for pkg in packages/di-framework-core \
          packages/di-framework-repo \
          packages/di-framework-http \
          packages/di-framework-graphql \
          packages/di-framework-events \
          packages/di-framework-config \
          packages/di-framework-auth \
          packages/di-framework-authz \
          packages/di-framework-socket \
          packages/di-framework-rpc \
          packages/di-framework-ai \
          packages/di-framework-ai-utils \
          packages/di-framework-codegen \
          packages/di-framework-cloudfoundry \
          packages/di-framework-wasmcloud \
          packages/di-framework-cli-extension \
          packages/di-framework-cli-plugin-wasmcloud \
          packages/di-framework-cli \
          packages/di-framework-tsc; do
            name=$(node -p "require('./$pkg/package.json').name")
            version=$(node -p "require('./$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "Skipping $name@$version (already published)"
              continue
            fi
            echo "Publishing $name@$version from $pkg"
            (cd "$pkg" && npm publish --access public --provenance --ignore-scripts)
          done

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
            echo "Created GitHub Release $TAG"
          else
            echo "GitHub Release $TAG already exists"
          fi

      - name: Notify the documentation repository
        if: github.ref_type == 'tag'
        env:
          DOCS_REPOSITORY_TOKEN: ${{ secrets.DOCS_REPOSITORY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOCS_REPOSITORY_TOKEN" ]]; then
            echo "::warning::DOCS_REPOSITORY_TOKEN is not configured; di-framework/docs was not notified of $GITHUB_REF_NAME"
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -X POST https://api.github.com/repos/di-framework/docs/dispatches \
            -H "Authorization: Bearer $DOCS_REPOSITORY_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$(jq -cn --arg tag "$GITHUB_REF_NAME" '{event_type:"framework-release",client_payload:{tag:$tag}}')"
          echo "Dispatched framework release $GITHUB_REF_NAME to di-framework/docs"
