name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Build packages
        run: bun run packages/bin/cmd/build.ts

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure modern npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Publish packages to npm
        run: |
          set -euo pipefail
          for pkg in packages/di-framework packages/di-framework-repo packages/di-framework-http packages/bin; do
            echo "Publishing $pkg"
            (cd "$pkg" && npm publish --access public --provenance --ignore-scripts)
          done
