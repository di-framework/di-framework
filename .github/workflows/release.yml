name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # create GitHub Release so docs-vX.Y.zip can attach
  id-token: write
  actions: write # dispatch Deploy Documentation on this tag for /vX.Y/ snapshots

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run packages/di-framework-cli/main.ts mx build --sync-versions

      - name: Test
        run: bun run test:all

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure modern npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Publish packages to npm
        run: |
          set -euo pipefail
          # Must stay in step with PACKAGES in packages/di-framework-cli/cmd/mx/build.ts.
          for pkg in packages/di-framework-core \
          packages/di-framework-repo \
          packages/di-framework-http \
          packages/di-framework-graphql \
          packages/di-framework-events \
          packages/di-framework-config \
          packages/di-framework-auth \
          packages/di-framework-authz \
          packages/di-framework-socket \
          packages/di-framework-rpc \
          packages/di-framework-ai \
          packages/di-framework-ai-utils \
          packages/di-framework-codegen \
          packages/di-framework-cli \
          packages/di-framework-tsc; do
            name=$(node -p "require('./$pkg/package.json').name")
            version=$(node -p "require('./$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "Skipping $name@$version (already published)"
              continue
            fi
            echo "Publishing $name@$version from $pkg"
            node -e "
              const fs = require('fs');
              const file = './$pkg/package.json';
              const json = JSON.parse(fs.readFileSync(file, 'utf8'));
              const fix = (deps) => {
                if (!deps) return;
                for (const k of Object.keys(deps)) {
                  if (k.startsWith('@di-framework/') && (deps[k] === 'workspace:*' || deps[k] === 'workspace:^')) {
                    deps[k] = '^' + '$version';
                  }
                }
              };
              fix(json.peerDependencies);
              fix(json.dependencies);
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
            "
            (cd "$pkg" && npm publish --access public --provenance --ignore-scripts)
            git checkout "./$pkg/package.json"
          done

      - name: Snapshot documentation for this release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Deploy Documentation attaches docs-vX.Y.zip to this release; without
          # it, later main deploys cannot restore /vX.Y/ snapshots and the
          # Writerside version picker stays hidden (needs 2+ versions).
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
            echo "Created GitHub Release $TAG"
          else
            echo "GitHub Release $TAG already exists"
          fi
          gh workflow run "Deploy Documentation" --ref "$TAG"
