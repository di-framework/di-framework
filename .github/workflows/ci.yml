name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  build-and-test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Check package tarballs
        run: bun run check-packaging

      - name: Test
        run: bun test --coverage

      - name: Enforce 100% line coverage
        run: bun scripts/check-line-coverage.ts

      - name: Verify coverage mapping
        run: bun scripts/check-coverage-mapping.ts

      - name: Export coverage to GitHub context & summary
        id: coverage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun -e '
            import { readFileSync, existsSync, appendFileSync } from "node:fs";
            import { resolve } from "node:path";
            import { getWorkspacePackages, parseLcov, calculatePackageMetrics } from "./scripts/coverage-mapping";

            const packages = getWorkspacePackages(resolve(process.cwd(), "packages"));
            const lcovPath = resolve(process.cwd(), "coverage/lcov.info");
            
            if (existsSync(lcovPath)) {
              const lcovContent = readFileSync(lcovPath, "utf8");
              const records = parseLcov(lcovContent);
              const metrics = calculatePackageMetrics(packages, records);

              let md = "### 📊 Code Coverage Summary\n\n| Package | Line Coverage | Lines Hit / Total |\n| --- | --- | --- |\n";
              
              const token = process.env.GITHUB_TOKEN;
              const repo = process.env.GITHUB_REPOSITORY;
              const sha = process.env.GITHUB_SHA;

              for (const m of metrics) {
                const details = m.isMeasured ? `${m.lh}/${m.lf}` : "N/A (" + m.unmeasuredReason + ")";
                md += `| \`${m.name}\` | **${m.status}** | ${details} |\n`;

                if (token && repo && sha && process.env.CI) {
                  const payload = {
                    state: "success",
                    context: `coverage/badges/${m.slug}`,
                    description: m.status,
                    target_url: `https://github.com/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`
                  };
                  fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`, {
                    method: "POST",
                    headers: {
                      "Authorization": `token ${token}`,
                      "Accept": "application/vnd.github.v3+json",
                      "User-Agent": "bun-script"
                    },
                    body: JSON.stringify(payload)
                  }).catch(err => console.error("Failed to post commit status:", err));
                }
              }

              if (process.env.GITHUB_STEP_SUMMARY) {
                appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
              }

              const totalLines = metrics.reduce((acc, s) => acc + (s.lf || 0), 0);
              const totalHits = metrics.reduce((acc, s) => acc + (s.lh || 0), 0);
              const pct = totalLines > 0 ? ((totalHits / totalLines) * 100).toFixed(1) : "0";

              if (process.env.GITHUB_OUTPUT) {
                appendFileSync(process.env.GITHUB_OUTPUT, `total_lines=${totalLines}\n`);
                appendFileSync(process.env.GITHUB_OUTPUT, `total_hits=${totalHits}\n`);
                appendFileSync(process.env.GITHUB_OUTPUT, `coverage_percentage=${pct}%\n`);
              }
            }
          '

      - name: Link CLI
        run: cd packages/di-framework-cli && bun link

      - name: Run E2E test suite
        run: di-framework test

  deno-examples:
    name: Deno examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Test Deno HTTP example
        working-directory: examples/packages/deno-http
        run: deno task test

      # The sandbox example provisions remote Deno Sandboxes and needs
      # service credentials, so keep its CI check compile-only.
      - name: Type-check Deno sandbox example
        working-directory: examples/packages/deno-sandboxes
        run: deno check --sloppy-imports src/main.ts src/test.main.ts src/sandbox.example.ts
