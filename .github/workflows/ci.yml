name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: write # dispatch Deploy Documentation to publish coverage badge JSON

jobs:
  build-and-test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Check package tarballs
        run: bun run check-packaging

      - name: Verify optional Transformers.js peer installs
        run: bun run check-ai-utils-optional-peer

      - name: Test
        run: bun test --coverage

      - name: Enforce 100% line coverage
        run: bun scripts/check-line-coverage.ts

      - name: Verify coverage mapping
        run: bun scripts/check-coverage-mapping.ts

      - name: Export coverage summary & Shields badge JSON
        id: coverage
        run: |
          bun -e '
            import { readFileSync, existsSync, appendFileSync } from "node:fs";
            import { resolve } from "node:path";
            import {
              getWorkspacePackages,
              parseLcov,
              calculatePackageMetrics,
              writeShieldBadgeFiles,
            } from "./scripts/coverage-mapping";

            const packages = getWorkspacePackages(resolve(process.cwd(), "packages"));
            const lcovPath = resolve(process.cwd(), "coverage/lcov.info");

            if (!existsSync(lcovPath)) {
              console.log("No coverage/lcov.info; skipping badge export");
              process.exit(0);
            }

            const lcovContent = readFileSync(lcovPath, "utf8");
            const records = parseLcov(lcovContent);
            const metrics = calculatePackageMetrics(packages, records);

            const badgeDir = resolve(process.cwd(), "coverage/badges");
            const written = writeShieldBadgeFiles(metrics, badgeDir);
            console.log(`Wrote ${written.length} Shields endpoint JSON file(s) to ${badgeDir}`);

            let md = "### 📊 Code Coverage Summary\n\n| Package | Line Coverage | Lines Hit / Total |\n| --- | --- | --- |\n";
            for (const m of metrics) {
              const details = m.isMeasured ? `${m.lh}/${m.lf}` : "N/A (" + m.unmeasuredReason + ")";
              md += `| \`${m.name}\` | **${m.status}** | ${details} |\n`;
            }

            if (process.env.GITHUB_STEP_SUMMARY) {
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
            }

            const totalLines = metrics.reduce((acc, s) => acc + (s.lf || 0), 0);
            const totalHits = metrics.reduce((acc, s) => acc + (s.lh || 0), 0);
            const pct = totalLines > 0 ? ((totalHits / totalLines) * 100).toFixed(1) : "0";

            if (process.env.GITHUB_OUTPUT) {
              appendFileSync(process.env.GITHUB_OUTPUT, `total_lines=${totalLines}\n`);
              appendFileSync(process.env.GITHUB_OUTPUT, `total_hits=${totalHits}\n`);
              appendFileSync(process.env.GITHUB_OUTPUT, `coverage_percentage=${pct}%\n`);
            }
          '

      - name: Upload Shields coverage badge JSON
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badges
          path: coverage/badges/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Link CLI
        run: cd packages/di-framework-cli && bun link

      - name: Run E2E test suite
        run: di-framework test

      - name: Convert LCOV to Cobertura
        run: |
          pip install lcov_cobertura --quiet
          lcov_cobertura coverage/lcov.info -o coverage/cobertura.xml

      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-typescript
          path: coverage/cobertura.xml

  upload-coverage-typescript:
    needs: build-and-test
    if: ${{ !cancelled() && needs.build-and-test.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-typescript
      - uses: actions/upload-code-coverage@v1
        with:
          file: cobertura.xml
          language: TypeScript
          label: code-coverage-agent

  # After Test succeeds on main, redeploy docs so /coverage/*.json is public for Shields.
  publish-coverage-badges:
    name: Publish coverage badges
    needs: build-and-test
    if: ${{ !cancelled() && needs.build-and-test.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch Deploy Documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run "Deploy Documentation" --repo "${{ github.repository }}" --ref main

  deno-examples:
    name: Deno examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Test Deno HTTP example
        working-directory: examples/packages/deno-http
        run: deno task test

      # The sandbox example provisions remote Deno Sandboxes and needs
      # service credentials, so keep its CI check compile-only.
      - name: Type-check Deno sandbox example
        working-directory: examples/packages/deno-sandboxes
        run: deno check --sloppy-imports src/main.ts src/test.main.ts src/sandbox.example.ts
