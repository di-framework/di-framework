name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Check package tarballs
        run: bun run check-packaging

      - name: Test
        run: bun test --coverage

      - name: Enforce 100% line coverage
        run: bun scripts/check-line-coverage.ts

      - name: Verify coverage mapping
        run: bun scripts/check-coverage-mapping.ts

      - name: Generate coverage badges
        run: bun scripts/generate-coverage-badges.ts

      - name: Export coverage to GitHub context & summary
        id: coverage
        run: |
          bun -e '
            import { readFileSync, appendFileSync } from "node:fs";
            const summary = JSON.parse(readFileSync("coverage/badges/summary.json", "utf8"));
            
            let md = "### 📊 Code Coverage Summary\n\n| Package | Line Coverage | Lines Hit / Total |\n| --- | --- | --- |\n";
            for (const [slug, info] of Object.entries(summary)) {
              const details = info.isMeasured ? `${info.lh}/${info.lf}` : "N/A";
              md += `| \`${info.name}\` | **${info.coverage}** | ${details} |\n`;
            }
            if (process.env.GITHUB_STEP_SUMMARY) {
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
            }
            
            const totalLines = Object.values(summary).reduce((acc, s) => acc + (s.lf || 0), 0);
            const totalHits = Object.values(summary).reduce((acc, s) => acc + (s.lh || 0), 0);
            const pct = totalLines > 0 ? ((totalHits / totalLines) * 100).toFixed(1) : "0";
            
            if (process.env.GITHUB_OUTPUT) {
              appendFileSync(process.env.GITHUB_OUTPUT, `total_lines=${totalLines}\n`);
              appendFileSync(process.env.GITHUB_OUTPUT, `total_hits=${totalHits}\n`);
              appendFileSync(process.env.GITHUB_OUTPUT, `coverage_percentage=${pct}%\n`);
            }
          '

      - name: Commit updated coverage badges
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage/badges/*.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(coverage): update dynamic coverage badges [skip ci]"
            git push
          fi

      - name: Link CLI
        run: cd packages/di-framework-cli && bun link

      - name: Run E2E test suite
        run: di-framework test

  deno-examples:
    name: Deno examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Test Deno HTTP example
        working-directory: examples/packages/deno-http
        run: deno task test

      # The sandbox example provisions remote Deno Sandboxes and needs
      # service credentials, so keep its CI check compile-only.
      - name: Type-check Deno sandbox example
        working-directory: examples/packages/deno-sandboxes
        run: deno check --sloppy-imports src/main.ts src/test.main.ts src/sandbox.example.ts
