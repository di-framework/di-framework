name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts
          # The bun package's postinstall links its platform binary. Other
          # lifecycle scripts stay skipped.
          node packages/di-framework-cli/node_modules/bun/install.js

      - name: Build packages
        run: bun run build

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.x"

      - name: Ensure modern npm for pack audit
        run: npm install -g npm@12.2.0 --ignore-scripts

      - name: Check package tarballs
        run: bun run check-packaging

      - name: Release dry-run
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/v')
        run: |
          set -euo pipefail
          bun run packages/di-framework-cli/main.ts mx build --sync-versions
          bun scripts/release-prepublish.ts --publish-dry-run
          git checkout -- packages/*/package.json

      - name: Test
        run: bun test --coverage

      - name: Enforce 100% line coverage
        run: bun scripts/check-line-coverage.ts

      - name: Verify coverage mapping
        run: bun scripts/check-coverage-mapping.ts

      - name: Export coverage summary & Shields badge JSON
        id: coverage
        run: |
          bun -e '
            import { readFileSync, existsSync, appendFileSync } from "node:fs";
            import { resolve } from "node:path";
            import {
              getWorkspacePackages,
              parseLcov,
              calculatePackageMetrics,
              writeShieldBadgeFiles,
            } from "./scripts/coverage-mapping";

            const packages = getWorkspacePackages(resolve(process.cwd(), "packages"));
            const lcovPath = resolve(process.cwd(), "coverage/lcov.info");

            if (!existsSync(lcovPath)) {
              console.log("No coverage/lcov.info; skipping badge export");
              process.exit(0);
            }

            const lcovContent = readFileSync(lcovPath, "utf8");
            const records = parseLcov(lcovContent);
            const metrics = calculatePackageMetrics(packages, records);

            const badgeDir = resolve(process.cwd(), "coverage/badges");
            const written = writeShieldBadgeFiles(metrics, badgeDir);
            console.log(`Wrote ${written.length} Shields endpoint JSON file(s) to ${badgeDir}`);

            let md = "### 📊 Code Coverage Summary\n\n| Package | Line Coverage | Lines Hit / Total |\n| --- | --- | --- |\n";
            for (const m of metrics) {
              const details = m.isMeasured ? `${m.lh}/${m.lf}` : "N/A (" + m.unmeasuredReason + ")";
              md += `| \`${m.name}\` | **${m.status}** | ${details} |\n`;
            }

            if (process.env.GITHUB_STEP_SUMMARY) {
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
            }

            const totalLines = metrics.reduce((acc, s) => acc + (s.lf || 0), 0);
            const totalHits = metrics.reduce((acc, s) => acc + (s.lh || 0), 0);
            const pct = totalLines > 0 ? ((totalHits / totalLines) * 100).toFixed(1) : "0";

            if (process.env.GITHUB_OUTPUT) {
              appendFileSync(process.env.GITHUB_OUTPUT, `total_lines=${totalLines}\n`);
              appendFileSync(process.env.GITHUB_OUTPUT, `total_hits=${totalHits}\n`);
              appendFileSync(process.env.GITHUB_OUTPUT, `coverage_percentage=${pct}%\n`);
            }
          '

      - name: Upload Shields coverage badge JSON
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-badges
          path: coverage/badges/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Link CLI
        run: cd packages/di-framework-cli && bun link

      - name: Run E2E test suite
        run: di-framework mx test

      - name: Convert LCOV to Cobertura
        run: |
          pip install "lcov-cobertura==2.1.1" --only-binary=:all: --quiet
          lcov_cobertura coverage/lcov.info -o coverage/cobertura.xml

      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report-typescript
          path: coverage/cobertura.xml

      - uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34 # v1
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          file: coverage/cobertura.xml
          language: TypeScript
          label: code-coverage-agent

  publish-coverage-badges:
    name: Dispatch docs deploy for coverage badges
    needs: build-and-test
    if: ${{ !cancelled() && needs.build-and-test.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch coverage update to di-framework/docs
        env:
          DOCS_REPOSITORY_TOKEN: ${{ secrets.DOCS_REPOSITORY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${DOCS_REPOSITORY_TOKEN:-}" ]]; then
            echo "::warning::DOCS_REPOSITORY_TOKEN is not configured; di-framework/docs was not notified of coverage update"
            exit 0
          fi
          payload="$(jq -n --argjson run_id "$GITHUB_RUN_ID" \
            '{event_type:"coverage-update",client_payload:{run_id:$run_id}}')"
          curl --fail-with-body --silent --show-error \
            -X POST https://api.github.com/repos/di-framework/docs/dispatches \
            -H "Authorization: Bearer $DOCS_REPOSITORY_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$payload"
          echo "Dispatched coverage update to di-framework/docs (run_id=$GITHUB_RUN_ID)"

  examples-regression:
    name: Examples regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve examples ref
        id: examples-ref
        run: |
          ref="main"
          if [ -f .examples-ref ]; then
            ref="$(cat .examples-ref | tr -d '[:space:]')"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout examples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: di-framework/examples
          path: examples
          ref: ${{ steps.examples-ref.outputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts
          # The bun package's postinstall links its platform binary. Other
          # lifecycle scripts stay skipped.
          node packages/di-framework-cli/node_modules/bun/install.js

      - name: Build packages
        run: bun run build

      - name: Link PR packages into examples
        run: bun run link:examples

      - name: Run Bun framework examples
        run: NODE_OPTIONS="--preserve-symlinks" bun --cwd examples --filter='./framework/*' test

      - name: Test Deno HTTP example
        working-directory: examples/framework/deno-http
        run: deno task test

      - name: Type-check Deno sandbox example
        working-directory: examples/framework/deno-sandboxes
        run: deno check --sloppy-imports src/main.ts src/test.main.ts src/sandbox.example.ts

