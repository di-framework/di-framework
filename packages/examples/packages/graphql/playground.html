<!doctype html>
<!--
  GraphiQL, served at / by server.ts.

  Loaded from a CDN rather than installed: GraphiQL is a React application, so
  depending on it would mean adding React and a bundler to an example whose
  point is that the domain classes are the whole API. The versions and their
  integrity hashes below are the ones published in graphql/graphiql's own
  `examples/graphiql-cdn`.

  Queries go to /graphql over HTTP; subscriptions go to the same path over a
  WebSocket speaking graphql-transport-ws (see `sockets` in server.ts).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>di-framework GraphQL example</title>
    <style>
      body {
        margin: 0;
      }

      #graphiql {
        height: 100dvh;
      }

      .loading {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        font-family: system-ui, sans-serif;
      }
    </style>
    <link
      rel="stylesheet"
      href="https://esm.sh/graphiql@5.2.4/dist/style.css"
      integrity="sha384-TFpQQKp325U5sd3PddH4cS0KOB3Gz/aqdEe12Mqkkq3wm2MGcDhRX5WhWf+o8akh"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://esm.sh/@graphiql/plugin-explorer@5.1.3/dist/style.css"
      integrity="sha384-vTFGj0krVqwFXLB7kq/VHR0/j2+cCT/B63rge2mULaqnib2OX7DVLUVksTlqvMab"
      crossorigin="anonymous"
    />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.2.8",
          "react/": "https://esm.sh/react@19.2.8/",
          "react-dom": "https://esm.sh/react-dom@19.2.8",
          "react-dom/": "https://esm.sh/react-dom@19.2.8/",
          "graphiql": "https://esm.sh/graphiql@5.2.4?standalone&external=react,react-dom,@graphiql/react,graphql",
          "graphiql/": "https://esm.sh/graphiql@5.2.4/",
          "@graphiql/plugin-explorer": "https://esm.sh/@graphiql/plugin-explorer@5.1.3?standalone&external=react,@graphiql/react,graphql",
          "@graphiql/react": "https://esm.sh/@graphiql/react@0.37.7?standalone&external=react,react-dom,graphql,@graphiql/toolkit,@emotion/is-prop-valid",
          "@graphiql/toolkit": "https://esm.sh/@graphiql/toolkit@0.12.1?standalone&external=graphql",
          "graphql": "https://esm.sh/graphql@17.0.2",
          "@emotion/is-prop-valid": "data:text/javascript,"
        },
        "integrity": {
          "https://esm.sh/react@19.2.8": "sha384-ZLbEMZxxxJSWKr0slZZsXGR6UNzfnEk4+qYI9PLH9QSxvWWQjs3UgkzrGuo33roA",
          "https://esm.sh/react-dom@19.2.8": "sha384-jssD0f2tUCDrNPAwM/2fFwybg7wF0K+9oVfFE0a7r0n7wb2UVP4/uYyWIZKGxG6L",
          "https://esm.sh/graphiql@5.2.4": "sha384-3feoWeu5QZYyfhHQyP8i+VBW+tYf58tTwgBb8Fsrw2QlP/YRBR2tscNGcYyRDtHC",
          "https://esm.sh/graphiql@5.2.4?standalone&external=react,react-dom,@graphiql/react,graphql": "sha384-n1sWmquV8wXH/vbn5Q8BaQAw8iAFku5zAs2fPBrht0L/OP4/qgZWL/v/WhMLFPBH",
          "https://esm.sh/@graphiql/plugin-explorer@5.1.3": "sha384-aDt72jaNBi2he5K4f47qh+xnS6Za54L6vuoNt6KtToLAJfebp23zCaAl3zXGl7dV",
          "https://esm.sh/@graphiql/react@0.37.7?standalone&external=react,react-dom,graphql,@graphiql/toolkit,@emotion/is-prop-valid": "sha384-U8awo9eG6M8scx4fjis/pNfYja4d5EtxOFYcmvDGG8K4Rt/bGB6Km1hxbQXZr9qH",
          "https://esm.sh/@graphiql/toolkit@0.12.1?standalone&external=graphql": "sha384-+cNTwZgIW33q7A4E+ZoCMqzcXdfVIc2VthQvJ0uDpRXERBWYuDKPVMzvdQU8x48o",
          "https://esm.sh/graphql@17.0.2": "sha384-IPvlcmnvWT91sKqwbg9MxPXJUuPmSdwXCp22x6hcbBkAEhlfSKkMLR3v19K9iRUp"
        }
      }
    </script>
    <script type="module">
      import { explorerPlugin } from '@graphiql/plugin-explorer';
      import { createGraphiQLFetcher } from '@graphiql/toolkit';
      import { GraphiQL, HISTORY_PLUGIN } from 'graphiql';
      import React from 'react';
      import ReactDOM from 'react-dom/client';
      import 'graphiql/setup-workers/esm.sh';

      /** Who you are. Everything downstream reads this through `@Ctx()`. */
      const headers = JSON.stringify(
        { 'x-member-id': 'm1', 'x-roles': 'librarian' },
        null,
        2,
      );

      /** One tab per idea. Ctrl/Cmd+Enter runs the active one. */
      const defaultTabs = [
        {
          query: `# One book, assembled from three bounded contexts.
# title/shelfLabel are Catalog's, reviews/averageRating are contributed by
# Reviews, onLoan by Lending — and Catalog knows about none of it.
{
  book(id: "b1") {
    title
    shelfLabel
    genre
    publishedAt
    metadata
    reviews { headline body }
    averageRating
    onLoan
  }
}`,
          headers,
        },
        {
          query: `# The same contributed fields over a list.
# Each is declared with @Field({ batch: '...' }), so this is 2 reads for the
# whole list rather than 2 per book. Watch the server log.
{
  books(limit: 10) {
    id
    title
    reviews { headline }
    averageRating
    onLoan
  }
}`,
          headers,
        },
        {
          query: `# A portal action. The input arrives as a ReviewInput instance, so
# ReviewInput.clampedRating() runs — 9 comes back as 5.
mutation PostReview($input: ReviewInput!) {
  postReview(input: $input) {
    id
    rating
    headline
    memberId
  }
}`,
          variables: JSON.stringify(
            { input: { bookId: 'b3', rating: 9, body: 'Read it in one sitting.' } },
            null,
            2,
          ),
          headers,
        },
        {
          query: `# An action declared on the entity that owns the invariant:
# Loan.checkIn(), keyed by id and loaded through the type's @Lookup.
# Run it twice — the second one is refused by the object itself.
mutation {
  loanCheckIn(id: "l1") {
    id
    state
    renewable
    daysRemaining
  }
}`,
          headers,
        },
        {
          query: `# Authorization is a domain decision (requireLibrarian), not middleware.
# Drop "x-roles" from the headers below and run it again.
mutation {
  addBook(input: {
    title: "The Dispossessed"
    author: "Ursula K. Le Guin"
    genre: Fiction
    publishedAt: "1974-05-01T00:00:00.000Z"
  }) {
    id
    title
    shelfLabel
  }
}`,
          headers,
        },
        {
          query: `# A container event, delivered over a WebSocket.
# Start this, then run "checkOut" from another tab as m2:
#
#   mutation { checkOut(bookId: "b3") { id } }
#
# LoanService only knows @Publisher('loan.checkedOut').
subscription {
  loanCheckedOut(memberId: "m2") {
    id
    memberId
    dueAt
    book { title }
  }
}`,
          headers,
        },
      ];

      const fetcher = createGraphiQLFetcher({
        url: '/graphql',
        subscriptionUrl: `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/graphql`,
      });

      const plugins = [HISTORY_PLUGIN, explorerPlugin()];

      function App() {
        return React.createElement(GraphiQL, {
          fetcher,
          plugins,
          defaultTabs,
          defaultHeaders: headers,
          shouldPersistHeaders: true,
          defaultEditorToolsVisibility: true,
        });
      }

      ReactDOM.createRoot(document.getElementById('graphiql')).render(React.createElement(App));
    </script>
  </head>
  <body>
    <div id="graphiql">
      <div class="loading">Loading…</div>
    </div>
  </body>
</html>
