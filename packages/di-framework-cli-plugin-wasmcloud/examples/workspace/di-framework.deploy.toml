# Deployment topology only. Project identity comes from each
# di-framework.config.json `name` — this file has no `apps` table.
default-target = "local"

[discovery]
include = ["**"]
exclude = ["vendor/**"]

[targets.local]
platform = "deploy/platform"
stack = "dev"

[targets.development]
controller = "${CONTROLLER_URL}"

[targets.development.registry]
push = "https://registry.example.com/team"
pull = "registry.internal.example.com/team"
insecure = false
